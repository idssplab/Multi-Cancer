n_gpu: 1
pin_memory: true
max_epochs: 50
cross_validation: true
csv_logger: true
bootstrap_repeats: 1000
n_folds: 4
batch_correction: false


optimizers:
  feat_ext:
    AdamW:
      lr: 0.01
  clf:
    SGD:
      lr: 0.05
      momentum: 0.9

models:
  Feature_Extractor:
    genomic_dim: 60 
    clinical_numerical_dim: 3
    clinical_categorical_dim: 11
    genomic_embedding_dim: 8
    clinical_embedding_dim: 8


  Task_Classifier:
    task_dim: 4
    genomic_embedding_dim: 8
    clinical_embedding_dim: 8
    output_dim: 1

datasets:

  project_ids: [LUAD, SCLC] #[BRCA, LUAD, COAD,SCLC]
  chosen_features:
    gene_ids:
      #BRCA: ['ESR1', 'EFTUD2', 'HSPA8', 'STAU1', 'SHMT2', 'ACTB', 'GSK3B', 'YWHAB', 'UBXN6', 'PRKRA', 'BTRC', 'DDX23', 'SSR1', 'TUBA1C', 'SNIP1', 'SRSF5', 'ERBB2', 'MKI67', 'PGR', 'PLAU']
      LUAD: ['HNRNPU', 'STAU1', 'KDM1A', 'SERBP1', 'DHX9', 'EMC1', 'SSR1', 'PUM1', 'CLTC', 'PRKRA', 'KRR1', 'OCIAD1', 'CDC73', 'SLC2A1', 'HIF1A', 'PKM', 'CADM1', 'EPCAM', 'ALCAM', 'PTK7']
      #COAD: ['HNRNPL', 'HNRNPU', 'HNRNPA1', 'ZBTB2', 'SERBP1', 'RPL4', 'HNRNPK', 'HNRNPR', 'TFCP2', 'DHX9', 'RNF4', 'PUM1', 'ABCC1', 'CD44', 'ALCAM', 'ABCG2', 'ALDH1A1', 'ABCB1', 'EPCAM', 'PROM1']
      SCLC: ['ESR1', 'EFTUD2', 'HSPA8', 'STAU1', 'SHMT2', 'ACTB', 'GSK3B', 'YWHAB', 'UBXN6', 'PRKRA', 'BTRC', 'DDX23', 'SSR1', 'TUBA1C', 'SNIP1', 'SRSF5', 'ERBB2', 'MKI67', 'PGR', 'PLAU']
  data_dir: Data/GDC_TCGA/
  cache_directory: Cache/GDC_TCGA/
  n_threads: 16
  batch_size: 32
  test_split: 0.2
  num_workers: 12
  multi_task: true
  graph_dataset: false
  ppi_score_name: escore
  ppi_score_threshold: 0.4
  use_repeated_genes: True
  batch_correction: False
  os_threshold: 60

